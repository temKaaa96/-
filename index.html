<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Чат</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{
    --bg:#0e0f13; --panel:#15171e; --panel-2:#1b1e27; --line:#262a36;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#6c8cff; --accent-2:#8a6cff;
    --user:#243049; --assistant:#171a22; --danger:#ff6b6b;
    --radius:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #1a1d2b 0%, var(--bg) 55%);
    color:var(--text);font-family:var(--font);display:flex;flex-direction:column;height:100dvh;
  }
  header{
    display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
    background:rgba(14,15,19,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;
  }
  .logo{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent)}
  header .spacer{flex:1}
  select,button,input{font-family:inherit}
  select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer;
  }
  .iconbtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:.15s;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--accent)}
  main{flex:1;overflow-y:auto;padding:24px 16px;scroll-behavior:smooth}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .msg{display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .avatar{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
  .msg.user{flex-direction:row-reverse}
  .msg.user .avatar{background:var(--user)}
  .msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .bubble{
    padding:12px 15px;border-radius:14px;line-height:1.55;font-size:15px;
    border:1px solid var(--line);max-width:78%;overflow-wrap:anywhere;
  }
  .msg.user .bubble{background:var(--user);border-color:#2c3a59}
  .msg.assistant .bubble{background:var(--assistant)}
  .bubble p{margin:.4em 0}
  .bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
  .bubble pre{background:#0c0e13;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px}
  .bubble code{background:#0c0e13;border-radius:5px;padding:.1em .35em;font-size:.9em}
  .bubble pre code{background:none;padding:0}
  .bubble ul,.bubble ol{margin:.4em 0;padding-left:1.3em}
  .bubble a{color:var(--accent)}
  .cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .empty{margin:auto;text-align:center;color:var(--muted);padding-top:8vh}
  .empty h1{color:var(--text);font-size:26px;margin:0 0 8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .chip{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  footer{border-top:1px solid var(--line);background:rgba(14,15,19,.7);backdrop-filter:blur(8px);padding:12px 16px}
  .composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{
    flex:1;resize:none;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.4;max-height:180px;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  .send{
    flex:none;width:46px;height:46px;border-radius:13px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:18px;transition:.15s;
  }
  .send:disabled{opacity:.4;cursor:default}
  .hint{max-width:820px;margin:6px auto 0;color:var(--muted);font-size:12px;text-align:center}
  /* settings modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:100%;max-width:440px}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal p{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .modal input{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal-row{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;border-radius:10px;padding:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;font-size:14px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff}
  @media(max-width:560px){.bubble{max-width:88%}}
</style>
</head>
<body>
  <header>
    <div class="logo"><span class="dot"></span> AI Чат</div>
    <div class="spacer"></div>
    <select id="model" title="Модель"></select>
    <button class="iconbtn" id="gear" title="Настройки">⚙️</button>
    <button class="iconbtn" id="clear" title="Очистить">🧹</button>
  </header>

  <main id="main">
    <div class="wrap" id="log"></div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Напиши сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <button class="send" id="send" title="Отправить">➤</button>
    </div>
    <div class="hint">Ответы генерирует ИИ и может ошибаться.</div>
  </footer>

  <!-- Настройки -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>⚙️ Настройки</h2>
      <p>Премиум-модель <b>Gemini 2.5 Flash</b> работает по ключу владельца сайта.
         Если хочешь использовать свой — вставь ключ Google AI Studio
         (начинается с <code>AIza</code> или <code>AQ.</code>). Бесплатно, без карты: aistudio.google.com.
         Ключ хранится только в этом браузере.</p>
      <label for="omkey">Свой ключ Gemini (необязательно)</label>
      <input id="omkey" type="password" placeholder="AIza... или AQ...." autocomplete="off" spellcheck="false">
      <div class="modal-row">
        <button class="btn" id="cancel">Отмена</button>
        <button class="btn primary" id="save">Сохранить</button>
      </div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const logEl=$("#log"), mainEl=$("#main"), inputEl=$("#input"), sendBtn=$("#send"),
      modelSel=$("#model"), overlay=$("#overlay");

let messages = JSON.parse(localStorage.getItem("chat_messages") || "[]");
let omKey = localStorage.getItem("gemini_key") || "";
let busy = false;

marked.setOptions({breaks:true});
const renderMd = txt => DOMPurify.sanitize(marked.parse(txt || ""));

// модели
fetch("/api/models").then(r=>r.json()).then(d=>{
  modelSel.innerHTML = d.models.map(m=>`<option value="${m.id}">${m.label}</option>`).join("");
  modelSel.value = localStorage.getItem("model") || d.models[0].id;
}).catch(()=>{ modelSel.innerHTML = '<option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>'; });
modelSel.addEventListener("change", ()=>localStorage.setItem("model", modelSel.value));

function avatar(role){ return role==="user" ? "🧑" : "🤖"; }

function addBubble(role, text){
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="avatar">${avatar(role)}</div><div class="bubble"></div>`;
  const bub = el.querySelector(".bubble");
  if(role==="assistant") bub.innerHTML = renderMd(text);
  else bub.textContent = text;
  logEl.appendChild(el);
  scrollDown();
  return bub;
}

function renderAll(){
  logEl.innerHTML = "";
  if(messages.length===0){
    logEl.innerHTML = `<div class="empty">
      <h1>👋 Привет!</h1>
      <div>Задай вопрос или выбери тему ниже</div>
      <div class="chips">
        <div class="chip" data-q="Объясни простыми словами, как работает блокчейн">Как работает блокчейн</div>
        <div class="chip" data-q="Накидай 5 идей для пет-проекта на Python">Идеи проектов</div>
        <div class="chip" data-q="Помоги составить план на день">План на день</div>
      </div></div>`;
    logEl.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ inputEl.value=c.dataset.q; send(); });
    return;
  }
  for(const m of messages) addBubble(m.role, m.content);
}

function scrollDown(){ mainEl.scrollTop = mainEl.scrollHeight; }
function persist(){ localStorage.setItem("chat_messages", JSON.stringify(messages.slice(-40))); }

async function send(){
  const text = inputEl.value.trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true;
  inputEl.value=""; autoGrow();

  messages.push({role:"user", content:text});
  if(logEl.querySelector(".empty")) logEl.innerHTML="";
  addBubble("user", text);
  persist();

  const bub = addBubble("assistant", "");
  bub.classList.add("cursor");
  let acc = "";

  try{
    const resp = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model: modelSel.value, messages, gemini_key: omKey })
    });
    if(!resp.ok){
      const e = await resp.json().catch(()=>({error:"Ошибка сервера"}));
      bub.classList.remove("cursor"); bub.innerHTML = renderMd("⚠️ " + (e.error||"Ошибка"));
      messages.pop(); persist(); return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      acc += dec.decode(value, {stream:true});
      bub.innerHTML = renderMd(acc);
      scrollDown();
    }
    bub.classList.remove("cursor");
    bub.innerHTML = renderMd(acc);
    messages.push({role:"assistant", content:acc});
    persist();
  }catch(err){
    bub.classList.remove("cursor");
    bub.innerHTML = renderMd("⚠️ Не удалось связаться с сервером.");
  }finally{
    busy=false; sendBtn.disabled=false; inputEl.focus();
  }
}

// ввод
function autoGrow(){ inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px"; }
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);

// очистка
$("#clear").addEventListener("click", ()=>{
  if(messages.length && !confirm("Очистить весь диалог?")) return;
  messages=[]; persist(); renderAll();
});

// настройки
$("#gear").addEventListener("click", ()=>{ $("#omkey").value=omKey; overlay.classList.add("open"); });
$("#cancel").addEventListener("click", ()=>overlay.classList.remove("open"));
overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.classList.remove("open"); });
$("#save").addEventListener("click", ()=>{
  omKey = $("#omkey").value.trim();
  localStorage.setItem("gemini_key", omKey);
  overlay.classList.remove("open");
});

renderAll();
inputEl.focus();
</script>
</body>
</html>
